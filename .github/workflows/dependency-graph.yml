name: Dependency graph

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - name: Export the resolved project graph without installing dependencies
        run: |
          pnpm sbom --lockfile-only --sbom-format cyclonedx --split --reporter silent --out "$RUNNER_TEMP/sbom/%s.cdx.json"
          node scripts/dependencyGraph.mjs "$RUNNER_TEMP/sbom" "$RUNNER_TEMP/snapshot.json"
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-graph
          path: |
            ${{ runner.temp }}/sbom/*.cdx.json
            ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 14

  submit:
    needs: generate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dependency-graph
          path: ${{ runner.temp }}/dependency-graph
      - name: Submit the current main graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="$RUNNER_TEMP/dependency-graph/snapshot.json"
          jq -e --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" '.sha == $sha and .ref == $ref' "$snapshot"
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_sha" = "$GITHUB_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            -H 'X-GitHub-Api-Version: 2026-03-10' --input "$snapshot" > "$RUNNER_TEMP/submission-result.json"
          jq -e '.result == "SUCCESS" or .result == "ACCEPTED"' "$RUNNER_TEMP/submission-result.json"
          jq '{id, result, created_at}' "$RUNNER_TEMP/submission-result.json"
